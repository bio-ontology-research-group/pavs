[project]
name = "pavs"
version = "0.1.0"
description = "Saudi Phenopackets Search"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "pyhpo",
    "pydantic",
    "aiosqlite",
    "python-multipart",
    "pandas",
    "tqdm",
    "pyphetools",
    "pronto",
    "rapidfuzz",
    "sentence-transformers>=5.2.2",
    "scikit-learn>=1.7.2",
    "numpy>=2.2.6",
    "torch>=2.10.0",
    "transformers>=5.1.0",
    "pyahocorasick>=2.3.0",
]

[tool.uv]
dev-dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["normalization", "intake", "scripts"]
