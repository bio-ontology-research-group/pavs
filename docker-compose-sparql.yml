# ─────────────────────────────────────────────────────────────────────────────
# PAVS Docker Compose stack
#
# Configuration: copy .env.example → .env and set your values.
# Docker Compose auto-loads .env from this directory.
#
# Quick start:
#   cp .env.example .env          # edit as needed
#   docker compose -f docker-compose-sparql.yml up -d
#
# Force-rebuild knowledge graph:
#   docker compose -f docker-compose-sparql.yml run --rm init --force
#
# After code changes to website/backend/ or website/frontend/ only:
#   docker compose -f docker-compose-sparql.yml build backend frontend
#   docker compose -f docker-compose-sparql.yml up -d backend frontend
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── 1. Triple store ──────────────────────────────────────────────────────────
  virtuoso:
    image: openlink/virtuoso-opensource-7:latest
    environment:
      DBA_PASSWORD: ${VIRT_DBA_PASSWORD:-pavs_dba}
      SPARQL_UPDATE: "yes"
      NumberOfBuffers: 10000
      MaxDirtyBuffers: 6000
      VIRT_Parameters_DirsAllowed: "., ../vad, /usr/share/proj, /rdf_import"
    ports:
      - "${PAVS_VIRTUOSO_HTTP_PORT:-8890}:8890"
      - "${PAVS_VIRTUOSO_SQL_PORT:-1111}:1111"
    volumes:
      - virtuoso_db:/var/lib/virtuoso/db
      - pavs_rdf:/rdf_import:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8890/sparql 2>/dev/null | head -c1 | grep -q . || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # ── 2. Data pipeline: generate phenopackets + RDF ────────────────────────────
  #    Skips each step if outputs already exist in the volume.
  #    Force full rebuild:
  #      docker compose -f docker-compose-sparql.yml run --rm init --force
  init:
    build:
      context: .
      dockerfile: Dockerfile.pavs
    command:
      - python
      - intake/prepare_all.py
      - "--endpoint=http://virtuoso:8890"
      - "--skip-load"
    volumes:
      - pavs_rdf:/app/rdf_output
    depends_on:
      virtuoso:
        condition: service_healthy
    restart: "no"

  # ── 3. Bulk loader: loads TTL files into Virtuoso via isql ───────────────────
  loader:
    image: openlink/virtuoso-opensource-7:latest
    environment:
      VIRT_DBA_PASSWORD: ${VIRT_DBA_PASSWORD:-pavs_dba}
    entrypoint:
      - bash
      - -c
      - |
        set -e
        echo "=== Waiting for Virtuoso to accept isql connections ==="
        until isql virtuoso:1111 dba "${VIRT_DBA_PASSWORD:-pavs_dba}" exec="SELECT 1" > /dev/null 2>&1; do
          echo "  waiting..."; sleep 3
        done
        echo "=== Running bulk load via isql ==="
        isql virtuoso:1111 dba "${VIRT_DBA_PASSWORD:-pavs_dba}" /load/load_ttl.sql
        echo "=== Load complete ==="
    volumes:
      - pavs_rdf:/rdf_import:ro
      - ./website/virtuoso:/load:ro
    depends_on:
      virtuoso:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    restart: "no"

  # ── 4. API backend ───────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.pavs
    ports:
      - "${PAVS_BACKEND_PORT:-8000}:8000"
    environment:
      SPARQL_ENDPOINT: http://virtuoso:8890/sparql
      DATA_DIR: /app/data
      HPO_TRANSLATION_PATH: /app/translation/hpo_arabic_translations.json
      HPO_OBO_PATH: /app/ontology/hp.obo
    depends_on:
      virtuoso:
        condition: service_healthy
      loader:
        condition: service_completed_successfully

  # ── 5. React frontend (nginx) ────────────────────────────────────────────────
  #    VITE_API_URL: set to the public base URL so the browser knows where the
  #    API lives.  Leave blank (default) to use relative paths – nginx will
  #    proxy /api/ to the backend and /sparql to Virtuoso automatically.
  frontend:
    build:
      context: ./website/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${PAVS_PUBLIC_URL:-}
    ports:
      - "${PAVS_FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  virtuoso_db:
  pavs_rdf:
